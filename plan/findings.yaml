    - title: Sudo-only gate test hides panics
      id: vqPd
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:authenticate-routes
        - effort:unspecified
      text: In api/httpapi/require_auth_mount_test.go the sudo-only test builds the core router with nil services and recovers from any panic, so it cannot distinguish passing the gate from an unrelated crash on the /entities routes. Build the router with minimal fake services or assert an explicit "status != 401 or panicked" flag.
    - title: No test asserts target-0 Authorize on miss
      id: aSRu
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:existence-leaks
        - effort:unspecified
      text: 'api/service/masked_resolve_test.go and api/httpapi/apps_test.go never assert that a masked miss calls Authorize once with target 0: the ownerOnlyAuthz fake records no calls and the apps fake keeps only the last call. Add a recording authorizer asserting one call with *target == 0 on a miss.'
    - title: Non-app entity ids give 404 to authorized
      id: F5yI
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:existence-leaks
        - effort:unspecified
      text: In api/httpapi/apps.go the AuthorizeResolve slug is only an error label and GetEntityByUUID is not type-scoped, so a caller authorized on an existing non-app entity id gets 404 from GetAppByUUID while a nonexistent id gets 403. This leaks existence only to callers already authorized on that id; the same pattern applies to subtype ErrNotFound in the corporation, natural person and service account services. Accept and document, or scope the resolve by entity type.
