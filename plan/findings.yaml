      text: 'api/service/masked_resolve_test.go and api/httpapi/apps_test.go never assert that a masked miss calls Authorize once with target 0: the ownerOnlyAuthz fake records no calls and the apps fake keeps only the last call. Add a recording authorizer asserting one call with *target == 0 on a miss.'
