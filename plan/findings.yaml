    - title: httpapi tests redeclare orderStrangerID
      id: u4LS
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:high
        - plan/phase:conflicts-and-order-tests
        - effort:unspecified
      text: api/httpapi/entities_order_test.go line 32 and apps_order_test.go line 30 both declare orderStrangerID in package httpapi, so go vet and go test fail to compile the package and none of the new order suites or the apps 409 tests run. Define the shared identity constants once (for example in an order_helpers_test.go next to orderAdminOnlyAuthz) and delete the duplicate, then re-run go vet and go test ./httpapi/... to surface any further errors.
    - title: slug 409 mapping matches any 23505
      id: QUsy
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:conflicts-and-order-tests
        - effort:unspecified
      text: 'writeAppsMutationError in api/httpapi/apps.go maps any Postgres 23505 to 409 apps.slug_taken without checking ConstraintName, but the Create and Update transactions also run CreateEntity and observers whose unique violations would be misreported as a slug conflict instead of 500. Also require the constraint name apps_slug_key, update appsOrderQuerier in apps_order_test.go to set it, and add negative tests: a 23505 with another constraint stays 500 on Create and on UpdateApp.'
