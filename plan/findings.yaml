version: 2
items:
    - title: Sudo-only gate test hides panics
      id: vqPd
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:authenticate-routes
        - effort:unspecified
      text: In api/httpapi/require_auth_mount_test.go the sudo-only test builds the core router with nil services and recovers from any panic, so it cannot distinguish passing the gate from an unrelated crash on the /entities routes. Build the router with minimal fake services or assert an explicit "status != 401 or panicked" flag.
    - title: No test asserts target-0 Authorize on miss
      id: aSRu
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:existence-leaks
        - effort:unspecified
      text: 'api/service/masked_resolve_test.go and api/httpapi/apps_test.go never assert that a masked miss calls Authorize once with target 0: the ownerOnlyAuthz fake records no calls and the apps fake keeps only the last call. Add a recording authorizer asserting one call with *target == 0 on a miss.'
    - title: Non-app entity ids give 404 to authorized
      id: F5yI
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:existence-leaks
        - effort:unspecified
      text: In api/httpapi/apps.go the AuthorizeResolve slug is only an error label and GetEntityByUUID is not type-scoped, so a caller authorized on an existing non-app entity id gets 404 from GetAppByUUID while a nonexistent id gets 403. This leaks existence only to callers already authorized on that id; the same pattern applies to subtype ErrNotFound in the corporation, natural person and service account services. Accept and document, or scope the resolve by entity type.
    - title: Field-crypto body read lacks MaxBytesReader
      id: C8JP
      date: "2026-10-11"
      tags:
        - type:security
        - priority:low
        - plan/phase:decode-and-shape
        - effort:unspecified
      text: readFieldCryptoKeyBody in api/httpapi/field_crypto_keys.go bounds the read with io.LimitReader rather than http.MaxBytesReader, so net/http gets no close-connection signal on an oversized body (it still drains at most 256 KiB then closes). Use http.MaxBytesReader(w, r.Body, max+1) for the read or accept the gap knowingly. Raw request bytes holding operator-supplied key hex are also not zeroed (not a regression).
    - title: Stale capability-gap text in type-level-authz
      id: 2TIM
      date: "2026-10-11"
      tags:
        - type:documentation
        - priority:medium
        - plan/phase:user-decisions-remediation
        - effort:unspecified
      text: docs/architecture/type-level-authorization.md lines ~194-199 still say the ErrInvalidInput capability gap in ServiceAccountService.UpdateByEntityUUID is 'unchanged and open'; phase 9 removed it. Update the paragraph. (Phase review, major doc-drift.)
    - title: Stale UpdateServiceAccount gap in next-steps
      id: 5BQZ
      date: "2026-10-11"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:user-decisions-remediation
        - effort:unspecified
      text: plan/next-steps.md line ~16 still lists the missing UpdateServiceAccount query as a gap, and the comment at api/httpapi/entities_order_test.go lines ~166-167 still describes the service-account PUT 400 as a capability gap. Both are stale after phase 9. (Phase review, minor.)
    - title: SA label update lacks trim/blank validation
      id: YvU6
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:user-decisions-remediation
        - effort:unspecified
      text: ServiceAccountService.UpdateByEntityUUID stores *in.Label as given with no TrimSpace and no blank check, while Create rejects blank labels and stores them trimmed; an update can store an empty or untrimmed label that Create would reject. Apply the same validation (stateless, in the handler before authz like Create) and trimming on update. Also drop the redundant GetServiceAccountByEntityID pre-check since UPDATE ... RETURNING reports a missing row. (Phase review, suggestion; correctness/efficiency.)
    - title: SA label update emits no audit observer event
      id: ovGY
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:user-decisions-remediation
        - effort:unspecified
      text: ServiceAccountService.UpdateByEntityUUID (api/service/service_account.go ~168-205) mutates the label through the caller-supplied querier with no txhelper.Run transaction and no s.obs.Observe / ObserveAfterCommit 'update' dispatch, unlike NaturalPersonService/CorporationService updates (natural_person.go ~339,346; corporation.go ~271,278) and SA Create. A service-account label change (reachable since phase 9) therefore produces no audit-log record. Wrap in a transaction and dispatch the same observer events as the sibling updates, with tests.
    - title: NP/corp update accepts blank names
      id: ferC
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:blank-name-remediation
        - effort:unspecified
      text: NaturalPersonService.UpdateByEntityUUID (natural_person.go ~299-304) and CorporationService.UpdateByEntityUUID (corporation.go ~231-233) trim but do not reject a blank given_name, family_name or legal_name, so an update can store an empty name that Create forbids. Add the same stateless blank checks to the PUT handlers before authorization (consistent with phase 10) and to the services for non-HTTP callers, with order tests.
    - title: OpenAPI omits NP/corp blank-name 400s
      id: C6w8
      date: "2026-10-11"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:remediation-04
        - effort:unspecified
      text: 'api/openapi.fragment.yaml: PUT natural-persons (~157-167) and PUT corporations (~249-258) route descriptions do not mention the new blank-name 400s though the service-account route does; UpdateNaturalPersonRequest and UpdateCorporationRequest schemas (~929-942, ~973-982) do not say blank names are rejected. Add the same sentence and a description or pattern ''\S'' on given_name, family_name, legal_name. Also pre-existing: those two schemas list display_name which handlers reject as unknown, and say at least one field is required while {} is accepted as a no-op. (Phase 11 review; minor doc-drift.)'
    - title: Absent-field update test is vacuous
      id: 3T6R
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:low
        - plan/phase:remediation-04
        - effort:unspecified
      text: 'api/httpapi/entities_order_test.go (~383-389): the absent-field case only checks that {} does not return 400. On the natural-person and corporation routes the fixture database refuses writes so the request returns 500 and the test still passes; the comment saying the update ''succeeds'' holds only for the service-account route. Assert the response body lacks the blank-name code or the exact per-route status, and fix the comment. (Phase 11 review; minor test-assertion.)'
