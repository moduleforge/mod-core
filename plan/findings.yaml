version: 2
items:
    - title: Dev warning still off in browser bundles
      id: 8YrZ
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:remediation-02
        - effort:unspecified
      text: 'HomeAppSwitcher `isDevelopment()` (gui/src/HomeAppSwitcher.tsx ~lines 141-149) still returns false early when `typeof process === ''undefined''`. Bundlers (Vite, esbuild, webpack 5) statically replace only the literal `process.env.NODE_ENV` and do not define a global `process` in the browser, so the dev-only renderLink href-fidelity warning still never fires in a browser dev build, the case it targets. Unit tests run under bun/jsdom where `process` exists, so they cannot catch it. Fix: drop the `typeof process` pre-check and rely on the existing try/catch (a ReferenceError from an unreplaced `process` is caught), keeping the `typeof document` check: `if (typeof document === ''undefined'') return false; try { return process.env.NODE_ENV !== ''production''; } catch { return false; }`. Reviewer confidence: medium; severity major.'
    - title: Origins memo key and warn-set robustness
      id: zxg6
      date: "2026-10-04"
      tags:
        - type:optimization
        - priority:low
        - plan/phase:remediation-02
        - effort:unspecified
      text: 'HomeAppSwitcher (gui/src/HomeAppSwitcher.tsx): (1) the origins memo key `JSON.stringify(allowedOrigins)` (~lines 201-208) returns undefined for undefined input and could throw on exotic non-serializable input before normalizeOrigins runs; `Array.isArray(allowedOrigins) ? allowedOrigins.join(''\u0000'') : ''''` is safer, cheaper, and avoids the eslint-disable coupling. (2) `warnedHrefs` (~lines 275-286) holds one string per distinct key+href+attr for the component lifetime; a renderer emitting a different href every render would grow it without bound and warn every render (dev-only). Optionally cap the set or clear it when the menu closes. Both are defensive nits, no functional defect today.'
