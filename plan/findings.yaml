    - title: SA label update lacks trim/blank validation
      id: YvU6
      date: "2026-10-11"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:user-decisions-remediation
        - effort:unspecified
      text: ServiceAccountService.UpdateByEntityUUID stores *in.Label as given with no TrimSpace and no blank check, while Create rejects blank labels and stores them trimmed; an update can store an empty or untrimmed label that Create would reject. Apply the same validation (stateless, in the handler before authz like Create) and trimming on update. Also drop the redundant GetServiceAccountByEntityID pre-check since UPDATE ... RETURNING reports a missing row. (Phase review, suggestion; correctness/efficiency.)
