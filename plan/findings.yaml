version: 2
items:
    - title: renderLink href fidelity unenforced
      id: WRkI
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:switcher-component
        - effort:small
      text: 'HomeAppSwitcher passes `href` to a custom `renderLink` only for allowed-origin entries (gui/src/HomeAppSwitcher.tsx, ~lines 225-243), but cannot enforce that the renderer spreads it unchanged; a router-based renderer could rewrite or resolve it relative to the current URL, weakening the origin guard. Keep the renderLink contract prominent in docs; optionally add a test or dev-mode warning that the rendered element''s href equals linkProps.href. Reviewer confidence: low.'
    - title: Switcher re-parses origins per entry
      id: SH6J
      date: "2026-10-04"
      tags:
        - type:optimization
        - priority:low
        - plan/phase:switcher-component
        - effort:small
      text: 'HomeAppSwitcher (gui/src/HomeAppSwitcher.tsx): `isAllowedNavHref` runs `new URL(o).origin` for every allowed origin for every entry (O(entries x origins)), and the `entries` memo depends on `allowedOrigins` by identity so an inline array literal re-runs it each parent render. `navigableIndexes()` re-runs flatMap per keydown and `childCount` is a reduce per render. All negligible at typical sizes (~10 entries, 1-3 origins). Optional: normalize allowedOrigins to a Set once in a memo, compute navigable indexes and childCount inside the entries memo, document passing a stable array.'
    - title: Dev-only href warning gated unreliably
      id: 5VrO
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:low
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'HomeAppSwitcher (gui/src/HomeAppSwitcher.tsx ~lines 135-146, 249-290): `isDevelopment()` requires `typeof process !== ''undefined''` and an optional-chained `process.env?.NODE_ENV`, so in browser bundles without a process shim (e.g. some Vite configs) the renderLink href-fidelity warning never fires, and it is the only guard against a renderer rewriting href. Gate on the literal `process.env.NODE_ENV !== ''production''` form bundlers replace, or `import.meta.env?.DEV`, or document it as best-effort. Related: the warning effect has no dependency array (re-runs every render while open) and `warnedHrefs` is keyed by entry key only and never cleared, so a later rewrite of the same key is not re-warned; key the dedupe on key|href|attr or clear it when renderLink/entries change, and add deps [isOpen, renderLink, entries]. Reviewer confidence: medium.'
    - title: allowedOrigins memo keyed on array identity
      id: sc9b
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'HomeAppSwitcher (gui/src/HomeAppSwitcher.tsx ~line 199): the normalized origins Set is memoized on the `allowedOrigins` array identity, so a caller mutating the same array in place (e.g. removing an origin) leaves a stale, more permissive Set until the identity changes. allowedOrigins is trusted configuration and the prop doc asks for a stable array, so this is hardening only: document that the array must be treated as immutable, or key the memo on a joined string of its entries. Reviewer confidence: low.'
