    - title: DecodeJSON unknown-field match is text-based
      id: WoUX
      date: "2026-10-10"
      tags:
        - type:bug
        - priority:low
        - effort:unspecified
        - plan/phase:helpers
        - plan/slug:error-precedence-foundation
      text: 'In api/apiresp/decode.go (failDecode, around lines 117-126), unknown JSON fields are detected by matching the error text prefix "json: unknown field", because encoding/json has no typed error for it. If a future Go release changes the message, the response stays 400 but degrades to the generic "must be valid JSON" detail. The first parameter of failDecode (decodeConfig) is also unused. Recommendation: keep the string match, add a test that pins the message (decode_test.go may already cover it), and drop the unused parameter. Reviewer-authored finding, medium confidence.'
