      text: 'Pre-existing doc link-chain gaps in this repo (not introduced by the reviewed diff). docs/mf-standards/ is empty, so README.md (lines 10, 30), AGENTS.md (lines 13, 15, 72, 185), docs/architecture/display-name-http.md (14, 117), gui/README.md (22, 24), model/README.md (10) and gui/tokens/STYLE-PACKAGE-CONTRACT.md (293, 561, 562) link to missing mf-standards targets (building-applications.md, building-modules.md, manifest-spec.md, architecture.md, architecture/db-considerations.md); AGENTS.md line 3 links a nonexistent .claude/settings.local.json. Orphans unreachable from README.md: error-banner-refactor.md, next-steps.md, stories-next.md, model/README.md, gui/README.md (AGENTS.md:137 mentions it as inline code only) and, through it, gui/tokens/README.md, gui/tokens/CONTRACT.md, gui/tokens/STYLE-PACKAGE-CONTRACT.md. Likely cause of the empty directory: an unsynced docs/mf-standards copy in the checked-out worktree; verify before editing links.'
    - title: ObserverGroup.Add accepts typed-nil, cycles
      id: MoCc
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:medium
        - effort:small
        - plan/phase:observer-group-add
        - plan/slug:observer-group-registration
      text: api/observer/observer.go (*ObserverGroup).Add rejects only nil interface values and direct self or same-root nesting. A typed-nil observer such as (*T)(nil), or a typed-nil *ObserverGroup, passes validation and panics later inside dispatch, possibly in a goroutine. Indirect nesting cycles (A contains B, B contains A) are undetected and cause unbounded recursion and an unrecoverable stack overflow. Consider rejecting a typed-nil *ObserverGroup, rejecting any *ObserverGroup argument outright (use Add instead of nesting), or bounding recursion depth.
    - title: Type id passed as entity target in create
      id: ls1q
      date: "2026-10-05"
      tags:
        - type:security
        - cross-repo/origin:mod-users
        - priority:unspecified
        - effort:unspecified
      text: 'mod-core passes a types.id as the Authorize target in api/service/natural_person.go (Create, ~line 184), api/service/corporation.go (~79), api/service/service_account.go (~72) and api/httpapi/apps.go (~162): Authorize(ctx, "create", &typeID). The production Authorizer (mod-users api/internal/authz/authz.go, exported as api/localAuthz) treats every non-nil target as an entities.id (grants.target_id and entities.owner_id), so any actor who owns, or holds a grant over, the entity whose numeric id equals that type id passes the admin-only create check (same class as app-mfmanager finding ilu6). mod-users is adding (*Authorizer).AuthorizeType(ctx, op, typeID int64) plus a localAuthz.TypeAuthorizer interface; fix here by type-asserting interface{ AuthorizeType(context.Context, string, int64) error } on the injected authorizer and otherwise calling Authorize(ctx, op, nil) -- never &typeID. Longer term, consider promoting an optional TypeAuthorizer interface and an authz.AuthorizeType(ctx, az, op, typeID) helper into core-api/authz (api/authz/authz.go) so every module shares one definition, and correcting the interface doc that currently says target is an entity id while the ecosystem convention passes type ids.'
    - title: Typed authz target in core contract
      id: ogPn
      date: "2026-10-05"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: api/authz/authz.go Authorizer.Authorize(ctx, operation, target *int64) carries one untyped int64, so an implementation cannot tell an entities.id from a types.id at runtime; passing a types.id was an authorization bypass class (an actor owning the entity whose id equals the type id passed type-level create). The additive fix is the optional authz.TypeAuthorizer capability plus the authz.AuthorizeType(ctx, az, op, typeID) helper (assert, else Authorize(ctx, op, nil)). Longer term, consider a typed target (e.g. a Target{Kind, ID} value or separate entity/type methods on the core interface) so misuse is a compile error. This is a breaking change for every Authorizer implementer, decorator and stub across the ModuleForge modules (mod-users api/internal/authz, mod-repos api/authz DecoratingAuthorizer, app-mfmanager api/httpapi Authorizer, all test stubs), so it needs an ecosystem-wide migration plan.
    - title: AuthorizeType nil check misses typed-nil
      id: gFDE
      date: "2026-10-06"
      tags:
        - type:bug
        - priority:low
        - effort:small
        - plan/phase:core-type-level-authorization
        - plan/slug:fix-actor-group-target-confusion
      text: 'Review finding (suggestion, medium confidence; agent-authored data): in api/authz/authz.go AuthorizeType rejects az == nil but an interface holding a typed nil pointer is not nil, so a TypeAuthorizer assertion can succeed and the method may panic on a nil receiver. A panic is not an allow, so this fails closed, and the same caveat applies to every other use of the Authorizer interface. Optional: mention it in the AuthorizeType doc comment.'
    - title: Apps Create uses ActorEntityID, not effective
      id: 8rS1
      date: "2026-10-06"
      tags:
        - type:security
        - priority:high
        - effort:small
        - plan/phase:core-type-level-authorization
        - plan/slug:fix-actor-group-target-confusion
      text: 'Review note (low confidence, pre-existing; agent-authored data): AppsHandler.Create in api/httpapi/apps.go checks authentication with opctx.ActorEntityID and validates input before authorizing, while the test authorizers use the effective (sudo-aware) actor id. Sudo resolution is delegated to the Authorizer through ctx. Open questions: (1) does the production Authorizer (mod-users) evaluate grants against EffectiveActorEntityID? (2) should admin-only create handlers authorize before validating input (400 before 403 is a small request-shape oracle)? Not introduced by this change; inside mod-core the actor used for the decision is correct (opctx.EffectiveActorEntityID prefers the sudo id). Escalation (quoted data): no remediation budget was available when this was evaluated (the server returned no budget block, so the evaluator treated it as exhausted); internal escalation is off, so the question of promote vs dismiss is surfaced to the user. Recommended: promote; consider filing the mod-users half as a cross-repo followup.'
