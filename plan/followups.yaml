    - title: ObserverGroup races concurrent tx queries
      id: 3vJn
      date: "2026-09-28"
      tags:
        - type:bug
        - priority:high
        - effort:medium
        - cross-repo/origin:mod-billing
      text: |-
        ObserverGroup.dispatch (api/observer/observer.go) fans out every attached MutationObserver.Observe call in parallel on the same pgx.Tx (errgroup under PolicyPropagate, sync.WaitGroup under PolicySwallow), passing the shared tx to every goroutine. pgx's own connection lock (pgconn.PgConn.lock) refuses a second concurrent use of one connection, returning connLockError{status: "conn busy"}; a pgx.Tx holds exactly one such connection, so two observers issuing queries against the same tx concurrently race for that lock and the loser gets "conn busy". At least one real consumer (mod-billing's in-transaction seatReleaseOnAccountDeletion observer, policy: propagate) queries its transaction from Observe. If a composer attaches a second query-issuing in-transaction observer to the same ObserverGroup instance, both observers' queries on that tx can race, and a "conn busy" failure under PolicyPropagate aborts the enclosing transaction. Question: must in-transaction observers attached to one ObserverGroup run serially against a shared pgx.Tx, or must MutationObserver's own contract instead state that a transaction is never safely shared for concurrent querying, so each observer knows it cannot issue tx-scoped queries concurrently with a sibling? The interface doc (observer.go lines 37-62) currently states neither. Source: mod-billing's mod-billing-hardening plan, phase-04 task-006.

        UPDATE 2026-10-04 - CONFIRMED REPRODUCTION (flow-accounts followup HmeL, plan auth-billing-marketplace-impl). This is no longer hypothetical: DELETE /v1/user-accounts/{uuid} on the composed flow-accounts server returns 500 (log: user_accounts.delete error="conn busy") for ANY account, with or without seats (reproduced with a person who holds no seat). The composed ObserverGroup holds two in-tx observers that both query the shared tx for the ("delete","user_account") observation: mod-audit's observer and mod-billing's seatReleaseOnAccountDeletion (api/service/seatrelease_observer.go Observe). Removing the seat-release observer from the group makes the same route return 204. The seat-release observer works correctly when called serially (flow-accounts cmd/server/appsetup/billing_composition_integration_test.go TestSeatReleaseObserverReleasesAndObserves). Impact: account deletion is broken in the composed server. flow-accounts cannot change the generated group, so the fix must be upstream: serialize in-tx dispatch over a shared tx in mod-core (preferred; makes the failing composition work without per-observer changes), or document and enforce that tx-using observers must not run concurrently. Suggested regression test: two observers on one group that each issue a query on the shared tx for the same observation must both succeed, under PolicyPropagate and PolicySwallow.
