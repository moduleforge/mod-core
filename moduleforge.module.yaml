module: core
goModule: github.com/moduleforge/core-api

go:
  api:
    modulePath: github.com/moduleforge/core-api
    dir: ./api
  model:
    modulePath: github.com/moduleforge/core-model
    dir: ./model

migrations:
  range:
    first: 1
    last: 99
  # importPath overrides the derived <go.model.modulePath>/migrations
  # default: this module's FS/TableName/Migrate loader lives at the model
  # sub-module's own root package (model/migrate.go, package model) rather
  # than under model/migrations/, because goose validate rejects any .go
  # file physically present in that directory (see docs-mf-standards
  # manifest-spec.md's model/migrations package contract section).
  importPath: github.com/moduleforge/core-model

provides:
  services:
    # typeResolver maps resource slugs to internal type IDs.
    - name: typeResolver
      type: "*types.Resolver"
      constructor: types.New
      returnsError: true
      args:
        - context        # context.Context for startup-time DB query
        - queries:coredb # coredb.New(pool) — reads the types table at boot

    # entityResolver maps entity UUIDs to internal int64 IDs.
    - name: entityResolver
      type: "*entity.Resolver"
      constructor: entity.NewResolver
      args: []

    # cipher loads the usable AES-256-GCM key set from the field_crypto_keys
    # table (defined in 0001_baseline.sql; see api/internal/fieldcrypto.NewFromEnvOrGenerate).
    # On an empty table it bootstraps the first key from CORE_FIELD_KEY_HEX
    # when set, otherwise from freshly generated random bytes.
    # CORE_FIELD_KEY_HEX is a first-boot-only bootstrap seed, not an ongoing
    # supply mechanism: on every later boot its bytes must either match the
    # active key exactly (proceeds silently) or construction fails loudly —
    # it never silently overrides an already-persisted key.
    - name: cipher
      type: "*fieldcrypto.Cipher"
      constructor: fieldcrypto.NewFromEnvOrGenerate
      returnsError: true
      args:
        - context
        - queries:coredb

    # coreServices is the aggregate of all entity service implementations.
    - name: coreServices
      type: "*coreservice.Services"
      constructor: coreservice.New
      args:
        - queries:coredb
        - infra:pool
        - service:authorizer
        - service:observerGroup
        - service:cipher
        - service:entityResolver
        - service:typeResolver

    # naturalPersonService extracts NaturalPersonServicer from coreServices.
    - name: naturalPersonService
      type: "coreservice.NaturalPersonServicer"
      constructor: coreservice.NaturalPersonFromServices
      args:
        - service:coreServices

    # displayRegistry is the single shared *display.Registry every module's
    # renderer registration targets. NewDisplayRegistry both builds the
    # registry and registers mod-core's own builtin renderers (natural_person,
    # corporation, service_account) as a side effect of construction — the
    # manifest spec's provides.services[] section explicitly sanctions a
    # side-effecting constructor, citing this module's own
    # fieldcrypto.NewFromEnvOrGenerate as the shipped precedent.
    - name: displayRegistry
      type: "*display.Registry"
      constructor: coreservice.NewDisplayRegistry
      args:
        - queries:coredb

    # displayService resolves and authorizes the target entity, then
    # dispatches through displayRegistry to render its human-readable name.
    # Backs GET /v1/entities/{uuid}/display-name (see coreDeps below). Arg
    # order matches coreservice.NewDisplayService's signature: reg, az,
    # entityResolver.
    - name: displayService
      type: "*coreservice.DisplayService"
      constructor: coreservice.NewDisplayService
      args:
        - service:displayRegistry
        - service:authorizer
        - service:entityResolver

    # coreDeps carries the external dependencies for the core httpapi router.
    # Requires coreServices (entity CRUD), logger (structured logging), and
    # displayService (display-name rendering). A composing app that omits
    # displayService can still call the two-argument corehttpapi.NewDeps
    # directly — it simply gets the graceful display_name: null behaviour.
    - name: coreDeps
      type: "corehttpapi.Deps"
      constructor: corehttpapi.NewDepsWithDisplay
      args:
        - service:coreServices    # *coreservice.Services
        - infra:logger            # *slog.Logger — from app manifest
        - service:displayService  # *coreservice.DisplayService

    # noopObserver is a MutationObserver that does nothing.
    - name: noopObserver
      type: "observer.NoopObserver"
      constructor: observer.NewNoopObserver
      args: []

    # coreAppsHandler serves the top-level /apps CRUD (Create/List/GetApp/
    # UpdateApp/DeleteApp). Closes followup Gp5C: mod-users' reference server
    # wired these routes as raw inline chi in its own main.go, never declared
    # in any module manifest, so they were unreachable on any mfgen-generated
    # app. Apps are now core entities (fundamental_type = "app"), so the
    # handler lives in mod-core alongside entityResolver. corehttpapi is the
    # same alias coreDeps/coreServices above already use for this module's
    # api/httpapi package. Arg order matches corehttpapi.NewAppsHandler's doc
    # comment: infra:pool, queries:coredb, service:authorizer,
    # service:observerGroup, service:entityResolver, service:typeResolver.
    - name: coreAppsHandler
      type: "*corehttpapi.AppsHandler"
      constructor: corehttpapi.NewAppsHandler
      args:
        - infra:pool
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:entityResolver
        - service:typeResolver

    # coreFieldCryptoKeyHandler serves the four admin field-encryption-key
    # rotation routes (inventory, rotate, mark-compromised, grace-window
    # adjustment). Every route on this handler authorizes as
    # h.az.Authorize(ctx, "manage", nil) — a nil target, which is
    # wildcard-grant-admin-only per mod-users' reference Authorizer — since
    # field_crypto_keys rows are not entities and carry no owner. Arg order
    # matches corehttpapi.NewFieldCryptoKeyHandler's doc comment: infra:pool,
    # queries:coredb, service:authorizer, service:observerGroup,
    # service:cipher. This is additive relative to the existing cipher
    # service below, which stays byte-for-byte unchanged.
    - name: coreFieldCryptoKeyHandler
      type: "*corehttpapi.FieldCryptoKeyHandler"
      constructor: corehttpapi.NewFieldCryptoKeyHandler
      args:
        - infra:pool
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:cipher

  observers:
    - name: noopSentinel
      service: noopObserver
      policy: swallow

  routes:
    # Core entity endpoints (/v1/entities/*) mounted inside the /v1 route group.
    # innerMount: true causes mfgen to emit:
    #   r.Route("/v1", func(r chi.Router) { r.Mount("/", corehttpapi.NewRouter(coreDeps)) })
    # instead of a top-level r.Mount("/v1", ...) which would conflict with the
    # mod-users /v1 route group and cause a chi duplicate-prefix panic (gap G14).
    # scope: authenticated is set explicitly because mfgen treats an empty route
    # scope as public (mfgen followup VFHF). Without it, the generated server
    # would not mount requireAuth in front of /v1/entities/*.
    - prefix: /v1
      mountFromModule: corehttpapi.NewRouter
      innerMount: true
      scope: authenticated
      args:
        - service:coreDeps

    # Top-level /apps CRUD (followup Gp5C). handler: coreAppsHandler references
    # the already-constructed provides.services entry above (no separate
    # constructor/args here — mirrors mod-authz's authzServices route entry),
    # and register: composes RegisterAppRoutes onto the shared /v1 route tree
    # instead of mounting a second full router at /v1 (the same
    # duplicate-Mount panic, gap G14, that the mountFromModule/innerMount
    # entry above avoids for the entities router, and that mod-tags'
    # register:-onto-/v1 entry documents for the same reason). Because
    # RegisterAppRoutes itself registers absolute /apps and /apps/{uuid}
    # paths (see api/httpapi/apps.go), nesting it inside the shared /v1
    # group yields /v1/apps, /v1/apps/{uuid}, matching the /v1/apps surface
    # mod-users' reference server exposed via inline chi (never reachable on
    # a generated app, since it was never declared in any manifest).
    - prefix: /v1
      handler: coreAppsHandler
      register: corehttpapi.RegisterAppRoutes
      scope: authenticated

    # Admin field-crypto-key rotation routes (followup to the rotation-api
    # design note). handler: coreFieldCryptoKeyHandler references the
    # already-constructed provides.services entry above, and register:
    # composes RegisterFieldCryptoKeyRoutes onto the shared /v1 route tree —
    # the same register:-onto-/v1 pattern coreAppsHandler uses above, for
    # the same duplicate-Mount (gap G14) reason. All four routes are
    # wildcard-grant-admin-only (h.az.Authorize(ctx, "manage", nil)); scope:
    # authenticated here only gates unauthenticated access at the router
    # level, not the per-route admin check the handler itself performs.
    - prefix: /v1
      handler: coreFieldCryptoKeyHandler
      register: corehttpapi.RegisterFieldCryptoKeyRoutes
      scope: authenticated

requires:
  services:
    - name: authorizer
  infra:
    - name: pool
    - name: logger    # *slog.Logger — from app manifest (for corehttpapi.NewDeps)
