# ---------------------------------------------------------------------------
# mod-core entities API — OpenAPI 3.0.3 fragment
#
# This is a FRAGMENT, not a standalone service spec. It is meant to be
# composed into a consumer's root spec via $ref. For example:
#
#   paths:
#     /self:
#       $ref: '../../mod-core/api/openapi.fragment.yaml#/paths/~1self'
#     /entities/natural-persons:
#       $ref: '../../mod-core/api/openapi.fragment.yaml#/paths/~1entities~1natural-persons'
#
# The fragment intentionally omits `servers:` because the mounting path and
# host are determined by each consuming service.
# ---------------------------------------------------------------------------

openapi: "3.0.3"

info:
  title: mod-core entities API
  version: "0.1.0"
  description: |
    Reusable OpenAPI fragment that describes the /entities/* routes owned by
    mod-core. Consuming services (e.g. mod-users) compose this fragment
    into their own root spec via $ref rather than duplicating the definitions.

# ---------------------------------------------------------------------------
# Default security — all paths require bearerAuth unless overridden with
# security: [] at the operation level.
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # /self is NOT defined here — mod-core has no users/auth concept and
  # cannot compose a meaningful identity response on its own. Consumers
  # that own a users layer (e.g. mod-users) define their own /self and
  # use core's EntityService.GetSelf helper for the entity portion.

  # --------------------------------------------------------------------------
  # /entities/natural-persons — natural person sub-collection
  # --------------------------------------------------------------------------
  /entities/natural-persons:
    post:
      tags: [Entities]
      operationId: createNaturalPerson
      summary: Create a natural-person entity (admin)
      description: |
        Creates a new Entity of kind `natural_person`, a LegalEntity record,
        and the associated NaturalPerson subtype record. Requires admin
        privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNaturalPersonRequest"
      responses:
        "201":
          description: Natural-person entity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /entities/natural-persons/{uuid}:
    get:
      tags: [Entities]
      operationId: getNaturalPerson
      summary: Read a natural-person entity
      description: |
        Returns the full profile for a natural-person entity. The authenticated
        caller must be the owner of this entity or have admin privileges.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      responses:
        "200":
          description: Natural-person profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Entities]
      operationId: updateNaturalPerson
      summary: Update a natural-person entity
      description: |
        Updates the mutable NaturalPerson fields (given_name, family_name) and
        the LegalEntity display_name. The authenticated caller must be the
        owner of this entity or have admin privileges.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNaturalPersonRequest"
      responses:
        "200":
          description: Updated natural-person profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --------------------------------------------------------------------------
  # /entities/corporations — corporation sub-collection
  # --------------------------------------------------------------------------
  /entities/corporations:
    post:
      tags: [Entities]
      operationId: createCorporation
      summary: Create a corporation entity (admin)
      description: |
        Creates a new Entity of kind `corporation`, a LegalEntity record, and
        the associated Corporation subtype record. Requires admin privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCorporationRequest"
      responses:
        "201":
          description: Corporation entity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /entities/corporations/{uuid}:
    get:
      tags: [Entities]
      operationId: getCorporation
      summary: Read a corporation entity
      description: |
        Returns the full profile for a corporation entity. Available to any
        authenticated caller.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      responses:
        "200":
          description: Corporation profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Entities]
      operationId: updateCorporation
      summary: Update a corporation entity (admin)
      description: |
        Updates the mutable Corporation fields (legal_name, jurisdiction) and
        the LegalEntity display_name. Requires admin privileges.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCorporationRequest"
      responses:
        "200":
          description: Updated corporation profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --------------------------------------------------------------------------
  # /entities/service-accounts — service-account sub-collection
  # --------------------------------------------------------------------------
  /entities/service-accounts:
    post:
      tags: [Entities]
      operationId: createServiceAccount
      summary: Create a service-account entity (admin)
      description: |
        Creates a new Entity of kind `service_account` and the associated
        ServiceAccount subtype record. Requires admin privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequest"
      responses:
        "201":
          description: Service-account entity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /entities/service-accounts/{uuid}:
    get:
      tags: [Entities]
      operationId: getServiceAccount
      summary: Read a service-account entity (admin)
      description: |
        Returns the full profile for a service-account entity. Requires admin
        privileges.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      responses:
        "200":
          description: Service-account profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Entities]
      operationId: updateServiceAccount
      summary: Update a service-account entity (admin)
      description: |
        Updates the mutable ServiceAccount field (label). Requires admin
        privileges.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceAccountRequest"
      responses:
        "200":
          description: Updated service-account profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --------------------------------------------------------------------------
  # /entities/{uuid} — generic entity lookup and archive
  # Note: these paths must appear AFTER the fixed sub-collection paths above
  # so that /entities/natural-persons etc. are not shadowed.
  # --------------------------------------------------------------------------
  /entities/{uuid}:
    get:
      tags: [Entities]
      operationId: getEntity
      summary: Read any entity and resolve its subtype
      description: |
        Resolves the entity by UUID, then joins the appropriate subtype table
        based on the `kind` discriminator. Returns a Profile whose subtype
        fields match the entity's kind. Available to any authenticated caller.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      responses:
        "200":
          description: Entity profile with resolved subtype.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Entities]
      operationId: archiveEntity
      summary: Archive an entity (admin, soft-delete)
      description: |
        Sets `archived_at` on the entity record. The entity remains in the
        database and can be restored. Requires admin privileges.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      responses:
        "204":
          description: Entity archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --------------------------------------------------------------------------
  # /entities/{uuid}/display-name — human-readable name for any entity
  # --------------------------------------------------------------------------
  /entities/{uuid}/display-name:
    get:
      tags: [Entities]
      operationId: getEntityDisplayName
      summary: Resolve an entity's human-readable display name
      description: |
        Renders a human-readable display name for the entity identified by
        `uuid`, via whatever renderer is registered for that entity's type.

        This operation requires the same real **`"read"` authorization on the
        target entity** as every other single-entity read in this API —
        merely holding the UUID entitles a caller to nothing. A UUID that
        does not exist and a UUID the caller is not authorized to read are
        deliberately indistinguishable: both return `403`, exactly as
        `GET /entities/{uuid}` already behaves. There is no `404` for this
        operation — existence is deliberately not disclosed.

        `display_name` is `null` — with a `200`, never an error status —
        only when the entity resolved and the caller is authorized to read
        it but no value can be rendered: no renderer is registered for that
        entity's type, or the deployment wires no display registry at all. A
        client should fall back to rendering the raw UUID in this case.
      parameters:
        - $ref: "#/components/parameters/EntityUUID"
      responses:
        "200":
          description: |
            Display name resolved, or the graceful-unavailable null form.
            Both shapes always include both fields.
          content:
            application/json:
              schema:
                type: object
                required: [uuid, display_name]
                properties:
                  uuid:
                    type: string
                    format: uuid
                    description: Stable external identifier of the resolved entity.
                  display_name:
                    type: string
                    nullable: true
                    description: |
                      Human-readable display name, or null when the entity is
                      readable but no renderer produced a value.
              examples:
                rendered:
                  summary: A renderer produced a value
                  value:
                    uuid: "0f5ecb1e-df1a-4b0a-9c2e-6f6f6a6b0e11"
                    display_name: "Ada Lovelace"
                unavailable:
                  summary: No renderer registered for this type, or no registry wired
                  value:
                    uuid: "0f5ecb1e-df1a-4b0a-9c2e-6f6f6a6b0e11"
                    display_name: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --------------------------------------------------------------------------
  # /field-crypto-keys — admin field-encryption-key rotation
  #
  # All four routes below authorize as h.az.Authorize(ctx, "manage", nil) —
  # a nil target, which is wildcard-grant-admin-only per the reference
  # Authorizer implementation. field_crypto_keys rows are not entities and
  # carry no owner, so there is no non-admin caller these routes ever admit.
  # No response schema here ever includes key material (key_bytes); the
  # inventory and rotation responses carry only versions and lifecycle
  # timestamps.
  # --------------------------------------------------------------------------
  /field-crypto-keys:
    get:
      tags: [FieldCryptoKeys]
      operationId: listFieldCryptoKeys
      summary: List field-encryption key versions (admin)
      description: |
        Returns every field-encryption key version with its lifecycle
        timestamps, ordered by version. Never returns key material. Requires
        wildcard-grant admin privileges.
      responses:
        "200":
          description: Field-encryption key inventory.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldCryptoKeyMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /field-crypto-keys/rotations:
    post:
      tags: [FieldCryptoKeys]
      operationId: rotateFieldCryptoKey
      summary: Rotate the active field-encryption key (admin)
      description: |
        Retires the current active key and installs a new active key, in a
        single transaction, then reloads this process's cipher so it
        converges immediately. When `key_hex` is omitted the server
        generates 32 cryptographically random bytes; when supplied, the
        operator's own material is decoded and length-validated exactly as
        `CORE_FIELD_KEY_HEX` is. When `compromised` is true, the retired key
        is flagged compromised at rotation time and `grace_period_days` must
        be omitted or null — any read that still depends on the retired key
        and cannot re-encrypt away from it will subsequently fail. When
        `grace_period_days` is present, it must be at least 1: other
        processes may take up to 60 seconds to reload their key set after
        this rotation, and a 0-day (or negative) window resolves the
        retired key's decrypt deadline to the retirement instant itself,
        making blobs those processes are still concurrently sealing under
        the just-retired version unreadable the moment they are written.
        A 201 response confirms the rotation was recorded and this
        process's cipher reloaded; it is not confirmation that the
        compromised key has stopped being used fleet-wide, since other
        processes may keep encrypting new plaintext under the retired key
        for up to the 60-second key-set TTL until they next reload.
        Requires wildcard-grant admin privileges.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateFieldCryptoKeyRequest"
      responses:
        "201":
          description: Rotation completed; the previous key is retired and a new key is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateFieldCryptoKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /field-crypto-keys/{version}/mark-compromised:
    post:
      tags: [FieldCryptoKeys]
      operationId: markFieldCryptoKeyCompromised
      summary: Flag an already-retired key compromised (admin)
      description: |
        Marks a retired key version compromised after the fact, independent
        of the rotation event that retired it. Idempotent: a repeat call
        against an already-compromised version returns 200 with the
        original timestamp unchanged. Requires wildcard-grant admin
        privileges.
      parameters:
        - $ref: "#/components/parameters/FieldCryptoKeyVersion"
      responses:
        "200":
          description: The key version is (now, or already was) flagged compromised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldCryptoKeyLifecycleState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No key exists at this version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The requested version is the still-active key, which cannot be marked compromised directly — rotate it instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /field-crypto-keys/{version}/grace:
    put:
      tags: [FieldCryptoKeys]
      operationId: setFieldCryptoKeyGracePeriod
      summary: Extend, shorten, or clear a retired key's decrypt window (admin)
      description: |
        Sets or clears `decryptable_until` on a retired key version. Send
        `grace_period_days: null` to clear the deadline (the key then
        decrypts indefinitely). This is also the only supported way to put a
        deadline on a compromised key — deliberately, and only after the
        fact, never as a silent side effect of a rotation. Requires
        wildcard-grant admin privileges.
      parameters:
        - $ref: "#/components/parameters/FieldCryptoKeyVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFieldCryptoKeyGraceRequest"
      responses:
        "200":
          description: The key version's grace deadline was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldCryptoKeyLifecycleState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No key exists at this version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The requested version is the still-active key, which has no grace window to set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # -------------------------------------------------------------------------
  # Security schemes
  # -------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained via any supported auth method (password, email-code,
        Google OIDC, Microsoft OIDC). Pass as `Authorization: Bearer <token>`.

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    EntityUUID:
      name: uuid
      in: path
      required: true
      description: External UUID of the entity.
      schema:
        type: string
        format: uuid

    FieldCryptoKeyVersion:
      name: version
      in: path
      required: true
      description: Key version number (the identity sequence starts at 1).
      schema:
        type: integer
        format: int64
        minimum: 1

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- Base types -----------------------------------------------------------

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: not_found
        message:
          type: string
          description: Human-readable error description.
          example: "entity not found"

    Entity:
      type: object
      description: |
        Base record present for every object in the system. Internal `id` is
        never serialized; `uuid` is the stable external identifier.
      required: [uuid, kind, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
          description: Stable external identifier.
        kind:
          type: string
          enum: [natural_person, corporation, service_account, type]
          description: |
            Discriminator indicating the concrete subtype. `type` is the
            sentinel kind of a type entity (the entity that represents one row
            of the types table).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the entity has been soft-deleted.

    LegalEntity:
      type: object
      description: |
        Common fields shared by NaturalPerson and Corporation. A LegalEntity
        always corresponds to exactly one Entity.
      required: [kind, display_name]
      properties:
        kind:
          type: string
          enum: [natural_person, corporation]
          description: Legal-entity subtype discriminator.
        display_name:
          type: string
          description: Human-readable name suitable for display in a UI.

    NaturalPerson:
      type: object
      description: Subtype record for an individual human entity.
      properties:
        given_name:
          type: string
          nullable: true
          description: Given (first) name.
        family_name:
          type: string
          nullable: true
          description: Family (last) name.

    Corporation:
      type: object
      description: Subtype record for a corporate or organisational entity.
      required: [legal_name]
      properties:
        legal_name:
          type: string
          description: Official registered legal name of the organisation.
        jurisdiction:
          type: string
          nullable: true
          description: |
            Jurisdiction of incorporation or registration (e.g. "US-DE",
            "GB", "CA-ON").

    ServiceAccount:
      type: object
      description: |
        Subtype record for a non-human actor (automated process, integration,
        etc.). ServiceAccounts are not LegalEntities.
      required: [label]
      properties:
        label:
          type: string
          description: Short human-readable identifier for the service account.

    # -- Composite profile response ------------------------------------------

    Profile:
      type: object
      description: |
        Composite response that always includes the Entity base fields plus the
        resolved subtype. The `kind` field on the Entity acts as a discriminator:
        when kind is `natural_person` the `natural_person` key is populated;
        when kind is `corporation` the `corporation` key is populated; when kind
        is `service_account` the `service_account` key is populated. When kind
        is `type` the response is the flat type-entity form: `type_slug`,
        `type_name`, `type_description`, `concrete` and (when deprecated)
        `deprecated_at` describe the represented type; no internal ids appear.
      required: [entity]
      properties:
        entity:
          $ref: "#/components/schemas/Entity"
        legal_entity:
          $ref: "#/components/schemas/LegalEntity"
          description: |
            Present when kind is `natural_person` or `corporation`; absent for
            `service_account`.
          nullable: true
        natural_person:
          $ref: "#/components/schemas/NaturalPerson"
          description: Present only when kind is `natural_person`.
          nullable: true
        corporation:
          $ref: "#/components/schemas/Corporation"
          description: Present only when kind is `corporation`.
          nullable: true
        service_account:
          $ref: "#/components/schemas/ServiceAccount"
          description: Present only when kind is `service_account`.
          nullable: true
        type_slug:
          type: string
          description: Present only when kind is `type`. Slug of the represented type.
        type_name:
          type: string
          description: Present only when kind is `type`. Display name of the represented type.
        type_description:
          type: string
          description: Present only when kind is `type`. Empty when the type has no description.
        concrete:
          type: boolean
          description: Present only when kind is `type`. Whether entities may be created of the type.
        deprecated_at:
          type: string
          format: date-time
          description: Present only when kind is `type` and the type is deprecated.
        tax_id:
          type: string
          description: |
            Plaintext tax id (SSN for natural persons, EIN for corporations).
            Present only when the caller is an admin or the subject of the
            profile. Absent otherwise.
        tax_id_type:
          type: string
          enum: [SSN, EIN]
          description: |
            Kind of tax id held. Present only when tax_id is present.

    # -- Request bodies -------------------------------------------------------

    UpdateProfileRequest:
      type: object
      description: |
        Generic self-update request. Callers submit only the fields applicable
        to their entity kind. Unknown fields are ignored.
        NaturalPerson callers may set given_name and/or family_name.
        Corporation callers may set legal_name and/or jurisdiction.
      properties:
        given_name:
          type: string
          nullable: true
        family_name:
          type: string
          nullable: true
        legal_name:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true

    CreateNaturalPersonRequest:
      type: object
      required: [display_name]
      description: Request body for admin creation of a natural-person entity.
      properties:
        display_name:
          type: string
          description: Display name stored on the LegalEntity record.
        given_name:
          type: string
          nullable: true
        family_name:
          type: string
          nullable: true
        ssn:
          type: string
          description: |
            Optional plaintext Social Security Number. Stored encrypted at rest.
            Returned on read only to admins or to the subject themselves.

    UpdateNaturalPersonRequest:
      type: object
      description: |
        Mutable fields for a natural-person entity. At least one field must be
        present. Omitted fields are left unchanged.
      properties:
        display_name:
          type: string
        given_name:
          type: string
          nullable: true
        family_name:
          type: string
          nullable: true
        ssn:
          type: string
          description: |
            Optional plaintext Social Security Number. Three-state semantics:
            omit the field entirely to leave the stored value unchanged;
            supply an empty string ("") to clear the stored value;
            supply a non-empty string to set a new value. Stored encrypted at
            rest. Returned on read only to admins or to the subject themselves.

    CreateCorporationRequest:
      type: object
      required: [display_name, legal_name]
      description: Request body for admin creation of a corporation entity.
      properties:
        display_name:
          type: string
          description: Display name stored on the LegalEntity record.
        legal_name:
          type: string
          description: Official registered legal name.
        jurisdiction:
          type: string
          nullable: true
        ein:
          type: string
          description: |
            Optional plaintext Employer Identification Number. Stored encrypted
            at rest. Returned on read only to admins or to the subject
            themselves.

    UpdateCorporationRequest:
      type: object
      description: |
        Mutable fields for a corporation entity. At least one field must be
        present. Omitted fields are left unchanged.
      properties:
        display_name:
          type: string
        legal_name:
          type: string
        jurisdiction:
          type: string
          nullable: true
        ein:
          type: string
          description: |
            Optional plaintext Employer Identification Number. Three-state
            semantics: omit the field entirely to leave the stored value
            unchanged; supply an empty string ("") to clear the stored value;
            supply a non-empty string to set a new value. Stored encrypted at
            rest. Returned on read only to admins or to the subject themselves.

    CreateServiceAccountRequest:
      type: object
      required: [label]
      description: Request body for admin creation of a service-account entity.
      properties:
        label:
          type: string
          description: Short human-readable identifier for the service account.

    UpdateServiceAccountRequest:
      type: object
      description: |
        Mutable fields for a service-account entity. At least one field must be
        present.
      properties:
        label:
          type: string
          description: Replacement label for the service account.

    # -- Field-crypto-key rotation admin API -----------------------------------

    FieldCryptoKeyMetadata:
      type: object
      description: |
        Lifecycle metadata for one field-encryption key version. Never
        includes key material — `key_bytes` never crosses this boundary.
      required: [version, created_at, updated_at]
      properties:
        version:
          type: integer
          format: int64
          description: Key version number; the identity sequence starts at 1.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: |
            Last time this row was written, including a re-encrypt-on-read
            write-back against data encrypted under it. Not a domain
            modification timestamp.
        retired_at:
          type: string
          format: date-time
          nullable: true
          description: Set once this version is no longer the active key.
        decryptable_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Absolute deadline after which this retired key stops decrypting.
            Null means no deadline (the safe default). Always null for the
            active key.
        compromised_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Set when this retired key has been flagged compromised, either at
            rotation time or after the fact. Always null for the active key.

    FieldCryptoKeyLifecycleState:
      type: object
      description: |
        Version and lifecycle-timestamp state for one field-encryption key,
        as returned by the mark-compromised and grace-window routes. Unlike
        FieldCryptoKeyMetadata, this shape never includes the created_at /
        updated_at row-bookkeeping timestamps — those routes build their
        response from lifecycle state alone, not the broader inventory row.
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: Key version number; the identity sequence starts at 1.
        retired_at:
          type: string
          format: date-time
          nullable: true
          description: Set once this version is no longer the active key.
        decryptable_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Absolute deadline after which this retired key stops decrypting.
            Null means no deadline (the safe default).
        compromised_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Set when this retired key has been flagged compromised, either at
            rotation time or after the fact.

    RotateFieldCryptoKeyRequest:
      type: object
      description: |
        Request to retire the current active key and install a new one.
        Every field is optional; an empty body performs a standard rotation
        with server-generated key material and no grace deadline.
      properties:
        key_hex:
          type: string
          writeOnly: true
          description: |
            Operator-supplied replacement key material, hex-encoded and
            decoded/length-validated exactly as `CORE_FIELD_KEY_HEX` is.
            Optional; omitted (the recommended default) means the server
            generates 32 cryptographically random bytes. Write-only: never
            echoed back in any response.
        compromised:
          type: boolean
          default: false
          description: |
            When true, the retired key is flagged compromised at rotation
            time, forcing decryptable_until to null on it. Rejected together
            with a non-null grace_period_days (400 invalid_input).
        grace_period_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 36500
          nullable: true
          description: |
            Number of days the retired key remains valid for decryption, up
            to 36500 days (~100 years). Null/omitted means no expiry. Must
            be omitted or null when compromised is true. Must be at least 1
            when present — 0 (or a negative value) is rejected, since a
            window that short is inside the up-to-60s window other
            processes may take to reload their key set after this
            rotation, and would resolve the retired key's decrypt deadline
            to the retirement instant itself.

    RetiredFieldCryptoKeySummary:
      type: object
      description: The key version just retired by this rotation.
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        retired_at:
          type: string
          format: date-time
        decryptable_until:
          type: string
          format: date-time
          nullable: true
        compromised_at:
          type: string
          format: date-time
          nullable: true

    ActiveFieldCryptoKeySummary:
      type: object
      description: The key version just installed as active by this rotation.
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    RotateFieldCryptoKeyResponse:
      type: object
      description: Result of a successful rotation. Never includes key material.
      required: [retired, active]
      properties:
        retired:
          $ref: "#/components/schemas/RetiredFieldCryptoKeySummary"
        active:
          $ref: "#/components/schemas/ActiveFieldCryptoKeySummary"

    SetFieldCryptoKeyGraceRequest:
      type: object
      required: [grace_period_days]
      description: |
        Request to set or clear a retired key's decrypt-window deadline.
      properties:
        grace_period_days:
          type: integer
          format: int32
          minimum: 0
          maximum: 36500
          nullable: true
          description: |
            New number of days the key remains valid for decryption, counted
            from now, up to 36500 days (~100 years). Send null to clear the
            deadline (decrypt indefinitely).

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:

    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Caller lacks the required privileges for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The requested entity does not exist or has been archived.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
